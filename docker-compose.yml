services:
  api:
    build:
      context: ../receita-facil-api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - api_data:/app
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  api_data:
